[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "h4l-analysis"
version = "0.1.0"
description = "Automated reproduction of the CMS H->4l (Higgs to four leptons) analysis using CMS Open Data"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Eve Carruthers", email = "evemarycarruthers@gmail.com" }
]
keywords = ["physics", "higgs", "cms", "cern", "open-data", "root"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "typer>=0.9.0",
    "pyyaml>=6.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "types-PyYAML>=6.0.0",
]

[project.scripts]
h4l = "h4l.cli:app"

[project.urls]
Homepage = "https://github.com/Eve-Carruthers/cern-h4l-analysis"
Documentation = "https://github.com/Eve-Carruthers/cern-h4l-analysis#readme"
Repository = "https://github.com/Eve-Carruthers/cern-h4l-analysis"

[tool.hatch.build.targets.wheel]
packages = ["src/h4l"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/configs",
    "/notes",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
]
ignore = [
    "E501",   # line too long (handled by formatter)
]

[tool.ruff.lint.isort]
known-first-party = ["h4l"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=h4l --cov-report=term-missing"
